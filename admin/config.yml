# Decap CMS content editor (wennerberg.dev/admin).
# Projects: one file per project, data/projects/<id>.md (card under "card:",
# page in the rest of the frontmatter + body). Saving triggers a GitHub Action
# rebuilding data/projects.yml (generated index the site reads).
# Keep all fields listed here or they get wiped on save.
# Never change an existing "id" (it is the file name).

backend:
  name: github
  repo: NoSlimes/wennerberg.github.io
  branch: main
  # Self-hosted OAuth (VPS nginx -> decap-oauth).
  base_url: https://decap.auth.noslimes.com
  auth_endpoint: /auth

# Local dev: run "npx decap-server".
local_backend: true

site_url: https://wennerberg.dev
display_url: https://wennerberg.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    description: "One file per project: its front page card and its page (project.html). Saving rebuilds data/projects.yml."
    folder: "data/projects"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    slug: "{{id}}"
    summary: "{{projectName}}"
    sortable_fields: ["order", "projectName"]
    fields:
      - { name: "projectName", label: "Project name", widget: "string" }
      - name: "id"
        label: "ID"
        widget: "string"
        pattern: ['^[a-z0-9_-]+$', "Lowercase letters, digits, - and _ only"]
        hint: "Becomes the file name and the page link (project.html?id=...). NEVER change on existing projects!"
      - { name: "order", label: "Order", widget: "number", default: 100, hint: "Lower shows first." }
      - { name: "navTitle", label: "Sidebar name", widget: "string", required: false, hint: "Short name in the sidebar. Defaults to the card title." }
      - name: "section"
        label: "Section"
        widget: "string"
        required: false
        hint: "Existing: 'Network and tools', 'Collaborative game projects'. Empty = ungrouped."
      - { name: "highlighted", label: "Highlighted", widget: "boolean", required: false, default: false }
      - { name: "hidden", label: "Hidden", widget: "boolean", required: false, default: false }
      - { name: "locked", label: "Locked", widget: "boolean", required: false, default: false, hint: "Hides it everywhere AND blocks the page: visitors only see a locked notice. The data files stay public." }
      - { name: "stub", label: "Stub / work in progress", widget: "boolean", required: false, default: false, hint: "Still listed everywhere, but the page shows a note that it's a work in progress and might be bare-bones." }
      - name: "links"
        label: "Links"
        widget: "object"
        required: false
        hint: "Shown on both the card and the page."
        fields:
          - { name: "github", label: "GitHub URL", widget: "string", required: false }
          - { name: "demo", label: "Demo URL", widget: "string", required: false }
      - name: "card"
        label: "Front page card"
        widget: "object"
        required: false
        collapsed: true
        hint: "Empty fields use the page's own value (name, type line, flairs, hero image, hero video)."
        fields:
          - { name: "title", label: "Card title", widget: "string", required: false }
          - { name: "type", label: "Card type line", widget: "string", required: false }
          - name: "flairs"
            label: "Card flairs"
            widget: "list"
            required: false
            field: { name: "flair", label: "Flair", widget: "string" }
          - { name: "description", label: "Card text", widget: "text", required: false }
          - { name: "image", label: "Card image", widget: "image", required: false, allow_multiple: false }
          - { name: "imageCaption", label: "Image caption", widget: "string", required: false }
          - { name: "videoUrl", label: "Card video URL", widget: "string", required: false }
          - { name: "duration", label: "Duration", widget: "string", required: false }
          - { name: "teamSize", label: "Team size", widget: "number", required: false }
          - { name: "status", label: "Status line", widget: "string", required: false }
      - { name: "pageTitle", label: "Page title", widget: "string", required: false }
      - { name: "projectType", label: "Type line", widget: "string", required: false }
      - name: "flairs"
        label: "Flairs"
        widget: "list"
        required: false
        field: { name: "flair", label: "Flair", widget: "string" }
      - { name: "heroImage", label: "Hero image", widget: "image", required: false, allow_multiple: false }
      - { name: "heroVideoUrl", label: "Hero video URL", widget: "string", required: false }
      - { name: "videoURL", label: "Video URL", widget: "string", required: false }
      - { name: "codeLanguage", label: "Code language", widget: "string", required: false }
      - name: "projectInfo"
        label: "Info rows"
        widget: "list"
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "value", label: "Value", widget: "text", required: false }
      - name: "highlights"
        label: "Highlights"
        widget: "list"
        required: false
        field: { name: "highlight", label: "Highlight", widget: "string" }
      - name: "galleryImages"
        label: "Gallery images"
        widget: "list"
        required: false
        field: { name: "image", label: "Image", widget: "image" }
      - { name: "body", label: "Body", widget: "markdown", required: false }

  - name: "meta"
    label: "Sections"
    label_singular: "File"
    description: "Category descriptions above the card groups."
    files:
      - name: "sections"
        label: "Sections"
        file: "data/sections.yml"
        fields:
          - name: "sections"
            label: "Sections"
            widget: "list"
            summary: "{{fields.section}}"
            fields:
              - { name: "section", label: "Section name", widget: "string", hint: "Must match the Section on the cards exactly." }
              - { name: "text", label: "Description", widget: "text" }

  - name: "experience"
    label: "Experience"
    label_singular: "Experience"
    description: "Experience entries (experience.html). Saved in place, no build step."
    folder: "data/experience"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    slug: "{{experienceName}}"
    summary: "{{experienceName}}"
    fields:
      - { name: "experienceName", label: "Company / Experience name", widget: "string" }
      - { name: "navTitle", label: "Sidebar name", widget: "string", required: false, hint: "Short name in the sidebar. Defaults to Company / Experience name." }
      - { name: "order", label: "Order", widget: "number", required: false, default: 100, hint: "Lower shows first in the sidebar." }
      - { name: "hidden", label: "Hidden", widget: "boolean", required: false, default: false, hint: "Hide from the sidebar. The page itself stays reachable by its link." }
      - { name: "locked", label: "Locked", widget: "boolean", required: false, default: false, hint: "Hides it everywhere AND blocks the page: visitors only see a locked notice. The data files stay public." }
      - { name: "stub", label: "Stub / work in progress", widget: "boolean", required: false, default: false, hint: "Still listed everywhere, but the page shows a note that it's a work in progress and might be bare-bones." }
      - { name: "pageTitle", label: "Page title", widget: "string", required: false }
      - { name: "experienceType", label: "Type line", widget: "string", required: false }
      - name: "flairs"
        label: "Flairs"
        widget: "list"
        required: false
        field: { name: "flair", label: "Flair", widget: "string" }
      - { name: "heroImage", label: "Hero image", widget: "image", required: false, allow_multiple: false }
      - { name: "heroVideoUrl", label: "Hero video URL", widget: "string", required: false }
      - { name: "videoURL", label: "Video URL", widget: "string", required: false }
      - { name: "codeLanguage", label: "Code language", widget: "string", required: false }
      - name: "experienceInfo"
        label: "Info rows"
        widget: "list"
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "value", label: "Value", widget: "text", required: false }
      - name: "highlights"
        label: "Highlights"
        widget: "list"
        required: false
        field: { name: "highlight", label: "Highlight", widget: "string" }
      - name: "galleryImages"
        label: "Gallery images"
        widget: "list"
        required: false
        field: { name: "image", label: "Image", widget: "image" }
      - { name: "body", label: "Body", widget: "markdown", required: false }
      - name: "links"
        label: "Links"
        widget: "object"
        required: false
        fields:
          - { name: "github", label: "GitHub URL", widget: "string", required: false }
          - { name: "website", label: "Website URL", widget: "string", required: false }
  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About"
        file: "data/about.md"
        format: "yaml-frontmatter"
        fields:
          - { name: "pageTitle", label: "Page title", widget: "string", required: false }
          - { name: "name", label: "Name", widget: "string" }
          - { name: "role", label: "Role", widget: "string", hint: "Shown under your name on the profile card." }
          - { name: "location", label: "Location", widget: "string", required: false }
          - { name: "portrait", label: "Portrait", widget: "image", required: false }
          - name: "languages"
            label: "Languages"
            widget: "list"
            required: false
            field: { name: "language", label: "Language", widget: "string" }
          - name: "links"
            label: "Links"
            widget: "object"
            required: false
            fields:
              - { name: "resume", label: "Resume page", widget: "string", required: false }
              - { name: "github", label: "GitHub URL", widget: "string", required: false }
              - { name: "linkedin", label: "LinkedIn URL", widget: "string", required: false }
          - { name: "body", label: "Content", widget: "markdown", hint: "Text before the first ## heading is the intro. Each ## starts a section. Inside a section, '### Place · Role' starts a timeline entry and the *italic* line right under it is its date." }
